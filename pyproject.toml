[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iflow-mcp-1c-alexmiawat-server"
version = "1.0.1"
description = "MCP proxy server for 1C:Enterprise - bridge between AI agents and 1C database"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "AlexMiaWat", email = "AlexMiaWat@gmail.com" }
]
keywords = ["mcp", "1c", "1c-enterprise", "model-context-protocol", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
iflow-mcp-1c-server = "iflow_mcp_1c_server.main:main_sync"

[project.urls]
Homepage = "https://github.com/iflow-mcp/alexmiawat-1c_mcp_server_own"
Repository = "https://github.com/iflow-mcp/alexmiawat-1c_mcp_server_own"
Issues = "https://github.com/iflow-mcp/alexmiawat-1c_mcp_server_own/issues"

[tool.hatch.build.targets.wheel]
packages = ["iflow_mcp_1c_server"]

[tool.hatch.build.targets.sdist]
include = [
    "/iflow_mcp_1c_server",
    "/README.md",
]